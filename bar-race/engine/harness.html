<!DOCTYPE html>
<!-- Render harness for the stat-race engine: harness.html?topic=girls_ssa[&safe=1][&hl={...}]
     Loads the channel design system (animations-v3 + stat-race + race-topics) with
     vendored React/Babel/fonts, so capture.mjs can seek and screenshot every frame. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  window.OM_PLAYBACK = '{"mode":"loop"}';
  window.RACE_ARGS = { topic: q.get('topic') || 'girls', safe: q.get('safe') === '1' };
  // &hl={"dim":0,"band":false} previews another highlight style without rebuilding the topic
  if (q.get('hl')) window.RACE_HL_OVERRIDE = JSON.parse(q.get('hl'));
</script>
</head>
<body>
<div id="root" style="position:fixed;inset:0"></div>
<script type="text/babel" src="animations-v3.jsx"></script>
<script type="text/babel" src="race-topics.jsx"></script>
<script type="text/babel" src="topics/girls_ssa.js"></script>
<script type="text/babel" src="stat-race.jsx"></script>
<script type="text/babel">
  const a = window.RACE_ARGS;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <StatRaceVideo topic={a.topic} safeZones={a.safe} />
  );
  window.RACE_READY = true;
</script>
</body>
</html>
